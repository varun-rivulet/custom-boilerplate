<!--
  templateType: global_partial
  label: Site header (logo only)
-->
<header class="site-header scheme-light">
  <div class="site-header-inner container">
    <div class="site-header-logo">
      {% module "header_logo"
        path="@hubspot/logo",
        label="Logo",
        img={
          "override_inherited_src": true,
          "src": get_asset_url("../../images/logo-placeholder.svg"),
          "alt": "Logo",
          "width": 160,
          "height": 40,
          "loading": "eager"
        }
      %}
    </div>
  </div>
</header>
